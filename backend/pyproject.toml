[project]
name = "rag-starter-backend"
version = "0.1.0"
description = "FastAPI backend for rag-starter: ingest documents, retrieve relevant chunks, answer with citations."
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
